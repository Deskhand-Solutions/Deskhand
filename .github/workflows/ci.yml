name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  main-source-guard:
    name: "PR Source Guard"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR Target & Source Branch
        run: |
          echo "Target Branch (Base): ${{ github.base_ref }}"
          echo "Source Branch (Head): ${{ github.head_ref }}"
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Only PRs originating from the 'develop' branch are allowed to target 'main'!"
            exit 1
          fi
          if [ "${{ github.base_ref }}" = "develop" ] && [[ ! "${{ github.head_ref }}" =~ ^feature/.* ]]; then
            echo "::error::Only PRs originating from 'feature/*' branches are allowed to target 'develop'!"
            exit 1
          fi

  backend-checks:
    name: "Django Backend Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: python manage.py check

      - name: Run Test Suite
        run: python runtests.py

  frontend-checks:
    name: "React Frontend Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Test Suite
        run: npm run test

      - name: Run Typecheck & Build
        run: npm run build
